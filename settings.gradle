import groovy.json.JsonSlurper

pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'averion-client'
def catalog = new JsonSlurper().parse(file('gradle/minecraft-targets.json'))
def requestedTargets = providers.gradleProperty('averionTarget').orNull
def enabledTargets = requestedTargets == null ? catalog.keySet() : requestedTargets.split(',', -1).collect {
    it.trim() == '1.16.0' ? '1.16' : it.trim()
}
def unknownTargets = enabledTargets.findAll { !catalog.containsKey(it) }
if (!unknownTargets.isEmpty()) {
    throw new GradleException("Unknown Averion targets: ${unknownTargets}")
}
enabledTargets.unique(false).each { include "targets:${it}" }
