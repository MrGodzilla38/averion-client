pluginManagement {
    repositories {
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'averion-client'
def supportedTargets = ['1.16.5', '26.3']
def requestedTarget = providers.gradleProperty('averionTarget').orNull
if (requestedTarget != null && !supportedTargets.contains(requestedTarget)) {
    throw new GradleException("Unknown Averion target: ${requestedTarget}")
}
def enabledTargets = requestedTarget == null ? supportedTargets : [requestedTarget]
enabledTargets.each { include "targets:${it}" }
