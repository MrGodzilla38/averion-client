plugins {
    id 'net.fabricmc.fabric-loom-remap'
}

ext {
    minecraftVersion = '1.16.5'
    fabricLoaderVersion = '0.20.1'
    fabricApiVersion = '0.42.0+1.16'
    fabricKeyModule = 'fabric-key-binding-api-v1'
    gameJava = 8
    yarnVersion = '1.16.5+build.10'
    splitClientSources = false
    productionTask = 'remapJar'
}
apply from: rootProject.file('gradle/client-target.gradle')
