plugins {
    id 'net.fabricmc.fabric-loom'
}

ext {
    minecraftVersion = '26.3'
    fabricLoaderVersion = '0.20.1'
    fabricApiVersion = '0.166.2+26.3'
    fabricKeyModule = 'fabric-key-mapping-api-v1'
    gameJava = 25
    splitClientSources = true
    productionTask = 'jar'
}
apply from: rootProject.file('gradle/client-target.gradle')
